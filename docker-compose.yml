# ─── Docker Compose — RetailOps Full Stack ─────────────────────────────────
# Usage: docker compose up -d
# Access:  http://<your-ip>:5173  (Frontend)
#          http://<your-ip>:3001   (Backend API)
#          http://<your-ip>:1433   (SQL Server)
#          http://<your-ip>:6379   (Redis)
#
# All containers restart automatically on Docker daemon restart (PC reboot).

version: '3.8'

services:
  # ── SQL Server ──────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: retailops-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1433
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_secrets:/var/opt/mssql/secrets
    networks:
      - retailops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis Cache & Pub/Sub ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: retailops-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - retailops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: brand-central-api
    ports:
      - '3001:3001'
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_NAME=retailops
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERT=true
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/logs:/app/backend/logs
    networks:
      - retailops-network
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Vite build + Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: brand-central-frontend
    ports:
      - '5173:80'
    networks:
      - retailops-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

networks:
  retailops-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  sqlserver_secrets:
    driver: local
  redis_data:
    driver: local
