name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/retail-ops

jobs:
  # ─── Pre-deploy Checks ───────────────────────────────────────────────
  pre-deploy:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify CI passed
        run: |
          echo "Checking if CI workflow passed..."
          # This job only runs if CI passes due to branch protection rules

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "❌ DEPLOY_HOST secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "❌ DEPLOY_USER secret not set"
            exit 1
          fi
          echo "✅ All required secrets present"

  # ─── Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: pre-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "🚀 Deploying ${{ github.sha }} to $HOST"

          ssh $USER@$HOST << 'DEPLOY'
          set -e

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/retail-ops}"

          echo "📡 Pulling latest code..."
          cd "$DEPLOY_PATH"
          git fetch origin
          git reset --hard origin/main

          echo "📦 Installing backend dependencies..."
          cd backend
          npm ci --omit=dev 2>&1 | tail -3

          echo "🔄 Running database migrations..."
          npm run migrate 2>&1 | tail -10 || echo "⚠️ No migrate script or migration failed"

          echo "📁 Ensuring directories..."
          mkdir -p logs uploads/exports uploads/temp

          echo "🔄 Restarting API..."
          pm2 restart brand-central-api --update-env 2>/dev/null || \
          pm2 start server.js --name brand-central-api \
            --max-memory-restart 3G \
            --node-options="--max-old-space-size=4096"

          echo "💾 Saving PM2 state..."
          pm2 save 2>/dev/null || true

          echo "✅ Deploy complete"
          pm2 status
          DEPLOY

      - name: Health check
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_HOST }}/api/health
        run: |
          echo "⏳ Waiting for server..."
          for i in 1 2 3 4 5 6; do
            sleep 5
            if curl -sf --max-time 10 "$HEALTH_URL" 2>/dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i/6..."
          done
          echo "❌ Health check failed after 6 attempts"
          exit 1

      - name: Post-deploy verification
        if: success()
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_HOST }}/api/health
        run: |
          echo "🔍 Running post-deploy verification..."
          RESPONSE=$(curl -s "$HEALTH_URL")
          echo "Health response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "healthy\|ok\|success"; then
            echo "✅ API responding correctly"
          else
            echo "⚠️ API response unexpected but server is up"
          fi

  # ─── Rollback ────────────────────────────────────────────────────────
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    needs: deploy
    if: failure()

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rollback to previous commit
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          echo "🔄 Rolling back deployment..."
          ssh $USER@$HOST << 'ROLLBACK'
          set -e
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/retail-ops}"
          cd "$DEPLOY_PATH"
          PREV_COMMIT=$(git log --oneline -n 2 | tail -1 | cut -d' ' -f1)
          echo "Rolling back to $PREV_COMMIT"
          git reset --hard $PREV_COMMIT
          cd backend
          npm ci --omit=dev 2>&1 | tail -3
          pm2 restart brand-central-api --update-env
          pm2 save
          echo "✅ Rollback complete"
          ROLLBACK

      - name: Verify rollback
        env:
          HEALTH_URL: https://${{ secrets.DEPLOY_HOST }}/api/health
        run: |
          echo "⏳ Verifying rollback..."
          for i in 1 2 3; do
            sleep 5
            if curl -sf --max-time 10 "$HEALTH_URL" 2>/dev/null; then
              echo "✅ Rollback verified - server healthy"
              exit 0
            fi
          done
          echo "❌ Rollback verification failed"

  # ─── Summary ─────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [deploy, rollback]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "🚀 Deployment summary"
          echo "   Commit: ${{ github.sha }}"
          echo "   Deploy status: ${{ needs.deploy.result }}"
          echo "   Rollback status: ${{ needs.rollback.result }}"
          echo "   Time:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment successful"
          elif [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "⚠️ Deployment failed, rollback successful"
          else
            echo "❌ Deployment failed, rollback failed - manual intervention required"
          fi