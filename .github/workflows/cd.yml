name: Deploy to Production

on:
  push:
    branches: [main]

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty or missing"
            exit 1
          fi

          # Normalize the stored key: strip CR characters (Windows copy/paste
          # contamination) and guarantee a trailing newline so ssh-add/libcrypto
          # can parse it. Fixes: 'Error loading key "(stdin)": error in libcrypto'
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fail fast with a clear message if the key still cannot be parsed
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key even after normalization. Re-save the secret: full key including -----BEGIN/END----- lines, LF newlines, trailing newline."
            exit 1
          fi
          echo "🔑 Key loaded, fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key)"

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          # Persist agent env for subsequent steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "🚀 Deploying ${{ github.sha }} to $HOST"

          ssh $USER@$HOST << 'DEPLOY'
          set -e

          echo "📡 Pulling latest code..."
          cd /var/www/retail-ops
          git fetch origin
          git reset --hard origin/main

          echo "📦 Installing backend dependencies..."
          cd backend
          npm ci --omit=dev 2>&1 | tail -3

          echo "📁 Ensuring directories..."
          mkdir -p logs uploads/exports uploads/temp

          echo "🔄 Restarting API..."
          pm2 restart brand-central-api --update-env 2>/dev/null || \
          pm2 start server.js --name brand-central-api \
            --max-memory-restart 3G \
            --node-options="--max-old-space-size=4096"

          echo "💾 Saving PM2 state..."
          pm2 save 2>/dev/null || true

          echo "✅ Deploy complete"
          pm2 status
          DEPLOY

      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *) URL="http://$HOST" ;;
          esac
          echo "⏳ Waiting for server at $URL ..."
          for i in 1 2 3 4 5; do
            sleep 5
            if curl -sf --max-time 10 "$URL/api/health" 2>/dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i/5..."
          done
          echo "⚠️ Health check failed — server may still be starting"

      - name: Summary
        if: always()
        run: |
          echo "🚀 Deployment summary"
          echo "   Commit: ${{ github.sha }}"
          echo "   Status: ${{ job.status }}"
          echo "   Time:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
