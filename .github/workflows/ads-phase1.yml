name: Ads Phase 1 Foundation
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/contracts/ads-*.json'
      - 'backend/database/adsSchema.js'
      - 'backend/database/adsPermissions.js'
      - 'backend/migrations/100_ads_permissions.js'
      - 'backend/controllers/roleController.js'
      - 'src/constants/permissions.js'
      - 'backend/database/adsImportSchema.js'
      - 'backend/migrations/099_ads_import_jobs.js'
      - 'backend/migrations/101_ads_import_queue.js'
      - 'backend/migrations/102_ads_preview_queue.js'
      - 'backend/migrations/103_ads_auto_ownership.js'
      - 'backend/migrations/104_ads_import_error_retention.js'
      - 'backend/migrations/105_ads_export_jobs.js'
      - 'backend/migrations/107_ads_report_covering_index.js'
      - 'backend/migrations/108_ads_report_revision.js'
      - 'backend/services/accessProfileService.js'
      - 'backend/testUtils/adsPhase2.*'
      - 'backend/testUtils/adsPhase3.*'
      - 'backend/testUtils/adsPhase5.*'
      - 'backend/testUtils/adsPhase6.*'
      - 'backend/testUtils/adsPhase7.*'
      - 'backend/services/cacheService.js'
      - 'backend/server.js'
      - 'Dockerfile.backend'
      - 'backend/services/ads*.js'
      - 'backend/services/reportExportJobs.js'
      - 'backend/controllers/reportExportJobsController.js'
      - 'src/components/common/DownloadsDrawer.jsx'
      - 'src/components/header/DownloadDrawer.jsx'
      - 'src/services/api.js'
      - 'backend/controllers/ads*.js'
      - 'backend/routes/adsRoutes.js'
      - 'backend/routes/dataRoutes.js'
      - 'backend/routes/exportRoutes.js'
      - 'backend/controllers/dashboardController.js'
      - 'backend/services/dashboardFinancialMetrics.js'
      - 'backend/services/dashboardFinancialRead.js'
      - 'backend/services/dashboardAdsMetrics.js'
      - 'backend/services/dashboardIntelligence.js'
      - 'backend/services/dashboardTargets.js'
      - 'backend/services/dashboardTaskIntelligence.js'
      - 'backend/testUtils/dashboardPhase3.*'
      - 'backend/testUtils/dashboardBatchFixture.js'
      - 'src/utils/dashboardRange.mjs'
      - 'src/services/__tests__/dashboardRange.test.mjs'
      - 'tests/dashboard-range.spec.js'
      - 'tests/fixtures/dashboard-range.*'
      - 'src/contexts/DateRangeContext.jsx'
      - 'backend/testUtils/dashboardPhase1.*'
      - 'backend/testUtils/dashboardPhase2.*'
      - 'backend/services/dashboardScope.js'
      - 'backend/controllers/alertsController.js'
      - 'backend/controllers/marketDataSyncController.js'
      - 'backend/routes/systemLogRoutes.js'
      - 'backend/services/SystemLogService.js'
      - 'src/hooks/useDashboard*.ts'
      - 'src/hooks/useRealTimeDashboard.ts'
      - 'src/utils/dashboardScope.mjs'
      - 'src/store/dashboardStore.ts'
      - 'src/services/__tests__/dashboardScope.test.mjs'
      - 'backend/__tests__/unit/dashboardTopAsins.test.js'
      - 'backend/__tests__/routes/dashboardAccess.test.js'
      - 'backend/controllers/targetController.js'
      - 'src/pages/opsCenter/**'
      - 'backend/utils/sellerScope.js'
      - 'backend/utils/roleUtils.js'
      - 'backend/migrations/098_ads_product_daily_facts.js'
      - 'backend/routes/uploadRoutes.js'
      - 'backend/testUtils/adsPhase1.*'
      - 'backend/scripts/validateAdsProductReport.js'
      - 'src/components/ads/**'
      - 'src/components/common/ReportDateRangePicker.jsx'
      - 'src/pages/ads/**'
      - 'tests/ads-layout.spec.js'
      - 'src/contexts/AuthContext.jsx'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/services/sessionRestore.mjs'
      - 'src/services/__tests__/sessionRestore.test.mjs'
      - 'src/services/__tests__/adsNumberFormat.test.mjs'
      - 'src/services/__tests__/adsOverviewModel.test.mjs'
      - 'src/services/__tests__/adsWorkspacePerformance.test.mjs'
      - 'backend/database/db.js'
      - 'backend/utils/errors.js'
      - 'backend/__tests__/routes/adsImportActions.test.js'
      - 'tests/fixtures/ads-layout.*'
      - '.github/workflows/ads-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check backend/database/db.js
          node --check backend/database/adsSchema.js
          node --check backend/database/adsPermissions.js
          node --check backend/migrations/100_ads_permissions.js
          node --check backend/controllers/roleController.js
          node --check backend/database/adsImportSchema.js
          node --check backend/migrations/099_ads_import_jobs.js
          node --check backend/migrations/101_ads_import_queue.js
          node --check backend/migrations/102_ads_preview_queue.js
          node --check backend/migrations/103_ads_auto_ownership.js
          node --check backend/migrations/104_ads_import_error_retention.js
          node --check backend/services/adsImportIssueChunks.js
          node --check backend/services/adsOwnership.js
          node --check backend/services/adsPreviewParser.js
          node --check backend/services/adsImportWorker.js
          node --check backend/services/adsImportJobs.js
          node --check backend/controllers/adsImportJobsController.js
          node --check backend/services/adsImportIssueReport.js
          node --check backend/server.js
          node --check backend/services/adsProductContract.js
          node --check backend/controllers/adsProductValidationController.js
          node --check backend/routes/uploadRoutes.js
          node --check backend/migrations/098_ads_product_daily_facts.js
          node --check backend/services/adsCanonicalIngestion.js
          node --check backend/services/adsCanonicalMetrics.js
          node --check backend/services/adsCanonicalScope.js
          node --check backend/controllers/adsCanonicalSummaryController.js
          node --check backend/services/adsCanonicalReport.js
          node --check backend/services/adsAnalyticsV3.js
          node --check backend/services/adsPortfolioAnalytics.js
          node --check backend/services/adsAnalyticsReconciliation.js
          node --check backend/controllers/adsCanonicalReportController.js
          node --check backend/services/adsImportConfirmation.js
          node --check backend/services/adsCanonicalTargets.js
          node --check backend/services/adsBudgetIntelligence.js
          node --check backend/services/adsProductDiagnostics.js
          node --check backend/controllers/adsCanonicalTargetsController.js
          node --check backend/services/adsConsumerMetrics.js
          node --check backend/controllers/dashboardController.js
          node --check backend/services/dashboardFinancialMetrics.js
          node --check backend/services/dashboardFinancialRead.js
          node --check backend/services/dashboardAdsMetrics.js
          node --check backend/services/dashboardIntelligence.js
          node --check backend/services/dashboardTargets.js
          node --check backend/services/dashboardTaskIntelligence.js
          node --check backend/services/dashboardScope.js
          node --check backend/controllers/alertsController.js
          node --check backend/controllers/marketDataSyncController.js
          node --check backend/services/SystemLogService.js
          node --test backend/testUtils/dashboardPhase1.contract.node.cjs backend/testUtils/dashboardPhase2.scope.node.cjs backend/testUtils/dashboardPhase3.contract.node.cjs
          node --check backend/controllers/targetController.js
          node --check backend/controllers/adsCanonicalExportController.js
          node --check backend/services/adsExportSnapshot.js
          node --check backend/services/adsCompleteWorkbook.js
          node --check backend/migrations/105_ads_export_jobs.js
          node --check backend/migrations/107_ads_report_covering_index.js
          node --check backend/migrations/108_ads_report_revision.js
          node --check backend/services/adsReportCache.js
          node --check backend/services/adsAnalystEvidence.js
          node --check backend/services/adsAnalystReview.js
          node --check backend/controllers/adsAnalystController.js
          node --check backend/services/adsExportJobs.js
          node --check backend/services/reportExportJobs.js
          node --check backend/controllers/reportExportJobsController.js
          node --check backend/services/adsExportCsv.js
          node --check backend/controllers/adsExportJobsController.js
          node --test backend/testUtils/adsPhase1.contract.node.cjs backend/testUtils/adsPhase1.canonical.node.cjs backend/testUtils/adsPhase1.report.node.cjs backend/testUtils/adsPhase1.activation.node.cjs backend/testUtils/adsPhase2.preview.node.cjs backend/testUtils/adsPhase3.analytics.node.cjs backend/testUtils/adsPhase3.portfolio.node.cjs backend/testUtils/adsPhase3.budget.node.cjs backend/testUtils/adsPhase3.reconciliation.node.cjs backend/testUtils/adsPhase6.cache.node.cjs backend/testUtils/adsPhase7.analyst.node.cjs
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'AdsDisposable#2026!'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/ads-test-sql --ignore-scripts --no-audit --no-fund mssql@12.7.11
      - run: node --test --test-concurrency=1 backend/testUtils/adsPhase1.sql.node.cjs backend/testUtils/adsPhase1.writer.sql.node.cjs backend/testUtils/adsPhase1.report.sql.node.cjs backend/testUtils/adsPhase2.jobs.sql.node.cjs backend/testUtils/adsPhase2.permissions.sql.node.cjs backend/testUtils/adsPhase2.load.sql.node.cjs backend/testUtils/adsPhase6.index.sql.node.cjs backend/testUtils/dashboardPhase1.sql.node.cjs
        env:
          ADS_SQL_SMOKE: '1'
          ADS_TEST_SQL_PASSWORD: 'AdsDisposable#2026!'
          ADS_TEST_MSSQL_MODULE: '/tmp/ads-test-sql/node_modules/mssql'
  export-jobs-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'AdsDisposable#2026!'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - run: node --test testUtils/adsPhase5.jobs.sql.node.cjs
        working-directory: backend
        env:
          ADS_SQL_SMOKE: '1'
          ADS_TEST_SQL_PASSWORD: 'AdsDisposable#2026!'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/services/__tests__/sessionRestore.test.mjs src/services/__tests__/adsNumberFormat.test.mjs src/services/__tests__/adsOverviewModel.test.mjs src/services/__tests__/adsWorkspacePerformance.test.mjs src/services/__tests__/dashboardScope.test.mjs src/services/__tests__/dashboardRange.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ads-layout.spec.js tests/dashboard-range.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ads-layout-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  consumer-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - run: npm test -- --runInBand __tests__/routes/adsRoutes.test.js __tests__/routes/adsImportActions.test.js __tests__/routes/dashboardAccess.test.js __tests__/unit/dashboardTopAsins.test.js
        working-directory: backend
      - run: node --test testUtils/adsPhase1.workbook.node.cjs testUtils/adsPhase2.issues.node.cjs testUtils/adsPhase5.workbook.node.cjs
        working-directory: backend
