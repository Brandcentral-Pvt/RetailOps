name: Tasks2 One-time Backend Lockfile Repair
on:
  push:
    branches:
      - feat/tasks2-production-phase1-20261123
    paths:
      - '.github/workflows/tasks2-lockfile-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Brandcentral-Pvt/RetailOps' && github.ref == 'refs/heads/feat/tasks2-production-phase1-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute the backend lockfile with npm's resolver
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency installation without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit the repaired lockfile only to the integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Backend lockfile already consistent"
          else
            git commit -m "fix(deps): regenerate backend npm lockfile for reproducible installs"
            git push origin HEAD:feat/tasks2-production-phase1-20261123
          fi
