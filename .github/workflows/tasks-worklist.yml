name: Tasks worklist
on:
  pull_request:
    paths:
      - 'src/modules/tasks/pages/TaskInstancesPage.jsx'
      - 'src/modules/tasks/components/TaskWorklist.jsx'
      - 'src/modules/tasks/task-instances.css'
      - 'src/modules/tasks/utils/taskListPresentation.js'
      - 'src/modules/tasks/utils/__tests__/taskListPresentation.test.js'
      - 'tests/task-worklist.spec.js'
      - 'tests/fixtures/task-worklist.*'
      - '.github/workflows/tasks-worklist.yml'
permissions:
  contents: read
jobs:
  worklist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/modules/tasks/utils/__tests__/taskListPresentation.test.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/task-worklist.spec.js --project=chromium
