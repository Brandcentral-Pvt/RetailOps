name: GMS Phase 2 Ingestion

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/gmsImport*.js'
      - 'backend/services/gmsAnalytics*.js'
      - 'backend/services/gmsExportWriter.js'
      - 'backend/services/streamingWorkbook.js'
      - 'backend/services/gmsCompleteExport.js'
      - 'backend/controllers/gmsAnalyticsController.js'
      - 'backend/controllers/gmsImportController.js'
      - 'backend/controllers/uploadController.js'
      - 'backend/controllers/exportController.js'
      - 'backend/routes/uploadRoutes.js'
      - 'backend/server.js'
      - 'backend/middleware/privateExportFiles.js'
      - 'backend/database/gmsSchema.js'
      - 'backend/scripts/repairGmsSchema.js'
      - 'backend/migrations/091_gms_import_jobs.js'
      - 'backend/migrations/092_gms_nullable_seller.js'
      - 'backend/migrations/093_gms_import_issue_reports.js'
      - 'backend/migrations/094_gms_analytics_date_index.js'
      - 'backend/migrations/095_gms_report_product_title.js'
      - 'backend/utils/gmsPhase1.js'
      - 'backend/__tests__/**/gmsPhase*.test.js'
      - 'src/components/gms/**'
      - 'src/pages/GmsTrackerPage.jsx'
      - 'src/pages/gms.css'
      - 'src/services/api.js'
      - 'src/services/exportDownloadIntegrity.mjs'
      - 'src/services/__tests__/exportDownloadIntegrity.test.mjs'
      - 'src/components/common/DownloadsDrawer.jsx'
      - 'src/components/asins/ExportAsinModal.jsx'
      - 'backend/services/exportFileIntegrity.js'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'tests/gms-phase1.spec.js'
      - '.github/workflows/gms-phase2.yml'
  workflow_dispatch:
    inputs:
      gms_scale_rows:
        description: 'Optional disposable SQL scale fixture'
        type: choice
        options: ['0', '100000', '500000']
        default: '0'

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Check GMS source syntax
        working-directory: backend
        run: |
          node --check services/gmsImportParser.js
          node --check services/gmsImportService.js
          node --check services/gmsAnalyticsService.js
          node --check services/gmsAnalyticsPageService.js
          node --check services/gmsAnalyticsFilters.js
          node --check services/gmsExportWriter.js
          node --check services/streamingWorkbook.js
          node --check services/exportFileIntegrity.js
          node --check middleware/privateExportFiles.js
          node --check services/gmsCompleteExport.js
          node --check migrations/095_gms_report_product_title.js
          node --check migrations/094_gms_analytics_date_index.js
          node --check controllers/gmsAnalyticsController.js
          node --check controllers/gmsImportController.js
          node --check routes/uploadRoutes.js
          node --check migrations/091_gms_import_jobs.js
          node --check migrations/092_gms_nullable_seller.js
          node --check migrations/093_gms_import_issue_reports.js
          node --check services/gmsImportIssueDetails.js
          node --check services/gmsImportIssueReport.js
          node --check server.js
          node --check database/gmsSchema.js
          node --check scripts/repairGmsSchema.js
      - name: Validation and route security regression
        working-directory: backend
        run: npm test -- --runInBand __tests__/unit/gmsPhase2Ingestion.test.js __tests__/unit/gmsPhase3Analytics.test.js __tests__/unit/gmsPhase4Scalability.test.js __tests__/unit/gmsPhase4CompleteExport.test.js __tests__/unit/gmsPhase4ExportIntegrity.test.js __tests__/routes/gmsPhase1.test.js
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scale_rows: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.gms_scale_rows) || '[100000,500000]') }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'GmsDisposable#2026!'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Install isolated SQL driver
        run: npm install --prefix /tmp/gms-test-sql --ignore-scripts --no-audit --no-fund mssql@12.7.11
      - name: Disposable SQL Server integration
        working-directory: backend
        env:
          GMS_SQLSERVER_SMOKE: '1'
          GMS_SQL_SCALE_ROWS: ${{ matrix.scale_rows }}
          GMS_TEST_SQLSERVER_HOST: '127.0.0.1'
          GMS_TEST_SQLSERVER_PASSWORD: 'GmsDisposable#2026!'
          GMS_TEST_MSSQL_MODULE: '/tmp/gms-test-sql/node_modules/mssql'
        run: npm test -- --runInBand __tests__/integration/gmsPhase2SqlServer.test.js
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/components/gms/__tests__/gmsPresentation.test.mjs src/services/__tests__/exportDownloadIntegrity.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/gms-phase1.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gms-phase2-playwright
          path: test-results/
          if-no-files-found: ignore
