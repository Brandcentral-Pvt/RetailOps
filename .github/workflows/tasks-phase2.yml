name: Tasks Phase 2 Template Engine

on:
  pull_request:
    branches: [main, fix/tasks-phase1-correctness]
    paths:
      - 'backend/services/pems/templateWorkflow.js'
      - 'backend/services/pems/taskViewDefinitionService.js'
      - 'backend/services/pems/taskWorkflowV2Execution.js'
      - 'backend/services/pems/taskExecutionGates.js'
      - 'backend/services/pems/taskInstanceSnapshot.js'
      - 'backend/services/pems/pemsService.js'
      - 'backend/migrations/042_pems_workflow_v2_activity_outputs.js'
      - 'backend/controllers/pems/pemsController.js'
      - 'backend/routes/pems/pemsRoutes.js'
      - 'backend/__tests__/unit/templateWorkflowV2.test.js'
      - 'backend/__tests__/unit/taskViewWorkflowV2.test.js'
      - 'backend/__tests__/unit/taskWorkflowV2Execution.test.js'
      - 'backend/__tests__/integration/pemsWorkflowV2SqlServer.test.js'
      - 'backend/__tests__/unit/pemsPhase2Instance.test.js'
      - 'backend/__tests__/routes/pemsWorkflowExecutionRoutes.test.js'
      - 'backend/__tests__/unit/taskViewPublicationIdentity.test.js'
      - 'backend/__tests__/routes/pemsWorkflowPreview.test.js'
      - 'backend/__tests__/fixtures/taskWorkflowV2.inventory.sample.json'
      - 'src/modules/tasks/view-registry/**'
      - 'src/modules/tasks/services/tasksApi.js'
      - '.github/workflows/tasks-phase2.yml'

permissions:
  contents: read

concurrency:
  group: tasks-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  template-engine:
    name: Phase 2 typed schema, trusted validators and frontend registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check schema, route and controller syntax
        working-directory: backend
        run: |
          node --check services/pems/templateWorkflow.js
          node --check services/pems/taskWorkflowV2Execution.js
          node --check services/pems/pemsService.js
          node --check services/pems/taskExecutionGates.js
          node --check services/pems/taskInstanceSnapshot.js
          node --check migrations/042_pems_workflow_v2_activity_outputs.js
          node --check services/pems/taskViewDefinitionService.js
          node --check controllers/pems/pemsController.js
          node --check routes/pems/pemsRoutes.js
      - name: Validate workflow V2 and existing Phase 1 contracts
        working-directory: backend
        run: |
          npm test -- --runInBand \
            __tests__/unit/templateWorkflowV2.test.js \
            __tests__/unit/taskWorkflowV2Execution.test.js \
            __tests__/unit/pemsPhase2Instance.test.js \
            __tests__/routes/pemsWorkflowExecutionRoutes.test.js \
            __tests__/unit/pemsPhase1ReviewGate.test.js \
            __tests__/unit/taskViewWorkflowV2.test.js \
            __tests__/routes/pemsWorkflowPreview.test.js \
            __tests__/unit/taskViewPublicationIdentity.test.js \
            __tests__/unit/taskInstanceSnapshot.test.js \
            __tests__/unit/pemsPhase1Instance.test.js \
            __tests__/routes/pemsChildAuthorization.test.js
      - name: Install frontend dependencies
        run: npm ci
      - name: Run existing task registry tests
        run: npm run test:task-registry
      - name: Check frontend build
        run: npm run build

  sql-persistence:
    name: Phase 2.2 migration and output CAS on SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Phase2Disposable#2026!'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install isolated SQL driver with complete dependency tree
        run: npm install --prefix /tmp/pems-phase2-sql --ignore-scripts --no-audit --no-fund mssql@12.7.11
      - name: Execute migration and revision tests in disposable tempdb
        working-directory: backend
        env:
          PEMS_SQLSERVER_SMOKE: '1'
          PEMS_TEST_SQLSERVER_HOST: '127.0.0.1'
          PEMS_TEST_SQLSERVER_PORT: '1433'
          PEMS_TEST_SQLSERVER_USER: 'sa'
          PEMS_TEST_SQLSERVER_PASSWORD: 'Phase2Disposable#2026!'
          PEMS_TEST_MSSQL_MODULE: '/tmp/pems-phase2-sql/node_modules/mssql'
        run: |
          npm test -- --runInBand __tests__/integration/pemsWorkflowV2SqlServer.test.js
