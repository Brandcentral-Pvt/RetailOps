name: Tasks Phase 1 Correctness

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/pems/**'
      - 'backend/middleware/pemsAccess.js'
      - 'backend/controllers/pems/pemsController.js'
      - 'backend/routes/pems/pemsRoutes.js'
      - 'backend/__tests__/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'src/modules/tasks/**'
      - '.github/workflows/tasks-phase1.yml'

permissions:
  contents: read

concurrency:
  group: tasks-phase1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Tasks backend correctness and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install reproducible backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check modified backend syntax
        working-directory: backend
        run: |
          node --check services/pems/taskExecutionGates.js
          node --check services/pems/taskInstanceSnapshot.js
          node --check services/pems/taskViewDefinitionService.js
          node --check services/pems/pemsPolicy.js
          node --check services/pems/pemsService.js
          node --check middleware/pemsAccess.js
          node --check routes/pems/pemsRoutes.js
          node --check controllers/pems/pemsController.js
      - name: Run Phase 1 unit and HTTP route suites
        working-directory: backend
        run: |
          npm test -- --runInBand \
            __tests__/unit/taskExecutionGates.test.js \
            __tests__/unit/taskInstanceSnapshot.test.js \
            __tests__/unit/taskViewDefinitionLegacy.test.js \
            __tests__/unit/pemsPhase1Instance.test.js \
            __tests__/unit/pemsPhase1Evidence.test.js \
            __tests__/unit/pemsPhase1ReviewGate.test.js \
            __tests__/unit/pemsProgressRebuild.test.js \
            __tests__/unit/pemsPolicy.test.js \
            __tests__/unit/templateConfig.test.js \
            __tests__/routes/pemsExecutionRoles.test.js \
            __tests__/routes/pemsInstances.test.js \
            __tests__/routes/pemsSellerScope.test.js
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend with the current Tasks components
        run: npm run build
      - name: Verify task view registry and safe template resolution
        run: npm run test:task-registry
      - name: Report pre-existing repository-wide TypeScript diagnostics
        continue-on-error: true
        run: |
          echo "Repository-wide Dashboard V2 TypeScript diagnostics are tracked separately from Phase 1 Tasks correctness."
          npm run typecheck
