name: Tasks Phase 1 Correctness

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/pems/**'
      - 'backend/middleware/pemsAccess.js'
      - 'backend/controllers/pems/pemsController.js'
      - 'backend/routes/pems/pemsRoutes.js'
      - 'backend/__tests__/**'
      - 'src/modules/tasks/**'
      - '.github/workflows/tasks-phase1.yml'

permissions:
  contents: read

concurrency:
  group: tasks-phase1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Task permissions, evidence, snapshot and progress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate backend lockfile correction evidence
        working-directory: backend
        run: |
          cp package-lock.json /tmp/tasks-phase1-lock-original.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('fs');
          const previous = JSON.parse(fs.readFileSync('/tmp/tasks-phase1-lock-original.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const delta = { root: {}, changedPackages: {}, removedPackages: [] };
          for (const [name, value] of Object.entries(current)) {
            if (name !== 'packages' && JSON.stringify(previous[name]) !== JSON.stringify(value)) delta.root[name] = value;
          }
          for (const [name, value] of Object.entries(current.packages || {})) {
            if (JSON.stringify(previous.packages?.[name]) !== JSON.stringify(value)) delta.changedPackages[name] = value;
          }
          for (const name of Object.keys(previous.packages || {})) {
            if (!(name in (current.packages || {}))) delta.removedPackages.push(name);
          }
          process.stdout.write('LOCK_DELTA_START' + JSON.stringify(delta) + 'LOCK_DELTA_END\\n');
          NODE
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check modified backend module syntax
        working-directory: backend
        run: |
          node --check services/pems/taskExecutionGates.js
          node --check services/pems/taskInstanceSnapshot.js
          node --check services/pems/taskViewDefinitionService.js
          node --check services/pems/pemsPolicy.js
          node --check services/pems/pemsService.js
          node --check middleware/pemsAccess.js
          node --check routes/pems/pemsRoutes.js
          node --check controllers/pems/pemsController.js
      - name: Run Phase 1 regression suite
        working-directory: backend
        run: |
          npm test -- --runInBand \
            __tests__/unit/taskExecutionGates.test.js \
            __tests__/unit/taskInstanceSnapshot.test.js \
            __tests__/unit/pemsPhase1Instance.test.js \
            __tests__/unit/pemsPolicy.test.js \
            __tests__/unit/templateConfig.test.js \
            __tests__/routes/pemsExecutionRoles.test.js \
            __tests__/routes/pemsInstances.test.js \
            __tests__/routes/pemsSellerScope.test.js
      - name: Frontend contract and syntax
        run: |
          npm ci
          npm run typecheck
          npm run build
